name: react-portfolio
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'
            - name: Clean npm cache
              run: npm cache clean --force
            - name: Install dependencies
              run: npm install --force
            - name: Run linting
              run: npm run lint
            - name: build
              run: npm run build

